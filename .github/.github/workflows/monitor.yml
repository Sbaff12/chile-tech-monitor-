name: Monitor Tiendas Valpo

on:
  schedule:
    # Esto le dice que corra automáticamente cada 6 horas (puedes cambiarlo después)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Esto te permite ejecutarlo manualmente cuando quieras desde la web

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar script de monitoreo
        run: python monitor.py
