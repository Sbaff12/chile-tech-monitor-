name: Radar Tecnologico Chile

on:
  schedule:
    # Se ejecuta automáticamente cada 6 horas
    - cron: '0 */6 * * *'
  # Permite que tú lo ejecutes manualmente con un botón cuando quieras
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Radar Tech
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Guardar historial para evitar alertas repetidas
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add historico_alertas.json || true
          git commit -m "Actualizar historial de alertas" || exit 0
          git push
